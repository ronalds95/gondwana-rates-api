sonar.projectKey=ronalds95_gondwana-rates-api
sonar.organization=ronalds95
sonar.projectName=gondwana-rates-api

# Scan the entire project
sonar.sources=.

# Specifically include PHP and HTML files
sonar.inclusions=**/*.php,**/*.html,**/*.htm,**/*.phtml

# Exclude common directories that don't contain source code
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/.git/**,**/.github/**,**/cache/**,**/logs/**

# For PHP projects, you might want to specify tests separately
sonar.tests=./tests,./Tests,./test,./Test
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-report.xml

sonar.sourceEncoding=UTF-8
